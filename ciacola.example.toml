# ciacola, annotated. Every section is optional; a server with an empty
# config file starts, serves the six verbs, and does nothing until told.
# The ledger path is deliberately an environment setting, not TOML:
#
#   mkdir -p "$HOME/.local/share/ciacola"
#   CIACOLA_DB="$HOME/.local/share/ciacola/ciacola.db" cargo run -p ciacola
#
# Without CIACOLA_DB the server uses $XDG_DATA_HOME/ciacola/ciacola.db, or
# $HOME/.local/share/ciacola/ciacola.db when XDG_DATA_HOME is unset. A
# temporary fallback is used only when no user data directory can be found.
#
# Human HTTP access to /mcp-operator uses a root bearer supplied through an
# inherited descriptor, never TOML or argv:
#
#   cargo build --locked -p ciacola
#   operator_token="$(openssl rand -hex 32)"  # store it in a credential manager
#   CIACOLA_OPERATOR_TOKEN_FD=3 ./target/debug/ciacola \
#     3< <(printf '%s' "$operator_token")
#
# Omit it when using stdio only. Every provider-backed agent credential is
# refused on /mcp-operator; the root bearer is for a human client only.

[runtime]
# Backend used when a role or agent does not select one. Omit for Claude.
# default_provider = "codex"

# Seal the ambient provider config. "full" drops user, project, and
# local settings; "project" keeps the user's global ones. Worth having
# on for unattended work: an interactive session inherits a CLAUDE.md
# the person can see, a scheduled agent inherits it invisibly.
hermetic = "full"

# Provider-native containment. Codex write-capable workers usually want
# workspace-write-no-network, or workspace-write when their task needs the
# network. Claude refuses a sandbox request because permission prompts are not
# an OS boundary.
# sandbox = "workspace-write-no-network"

# Isolation removes the operator's standing rules along with everything
# else, so put them back deliberately. Inline, or a file, or both.
# house_rules_file = "~/.claude/CLAUDE.md"

# Provider config and session directory. Pointing this at the server's
# own directory keeps transcripts with the run that produced them,
# which is the precondition for mining them later.
#
# It also isolates the login: a fresh directory authenticates as
# nobody. Mint a token with `claude setup-token` and name the variable
# holding it below.
# claude_home = "~/.local/share/ciacola/claude"
# token_env = "CIACOLA_CLAUDE_TOKEN"

# Codex keeps its own auth and sessions here. `codex_token_env` names a source
# variable that Ciacola maps to `CODEX_API_KEY` for a Codex turn. Treat the
# server and provider processes as one OS-user trust boundary.
# codex_home = "~/.local/share/ciacola/codex"
# codex_token_env = "CIACOLA_CODEX_TOKEN"

[limits]
# Circuit breakers, not budgets. Measured spend across real turns spans
# 54x, so no number is correct; a breaker only has to be wrong in the
# safe direction. Applies to new submissions, never to running work.
# Set both before adding a schedule. Leaving them commented is an
# explicit choice to run without a monetary circuit breaker.
# daily_warn_usd = 25.0
# daily_stop_usd = 50.0

# Depth is the leading indicator: a conductor spawning conductors
# compounds faster than any spend check notices. 0 disables.
max_spawn_depth = 3

# Backends that do not report money need a provider token stop before
# schedules, webhooks, or agents may submit work to them. Tokens are total
# input + output over a rolling 24 hours; cached input is already included in
# input and is never counted twice. Warning-only configuration does not make
# unattended work bounded.
# [limits.providers.codex]
# daily_warn_tokens = 2_000_000
# daily_stop_tokens = 4_000_000

# Dollar and token stops are independent admission breakers: reaching either
# refuses new work, while admitted and running turns finish. They are not
# reservations, so one turn can cross the threshold and concurrent turns can
# multiply the overshoot. Ciacola uses the measurements each backend reports
# and deliberately carries no provider price table.

# Plugins read their own sections; the server never sees these fields.
[plugins.repo-worker]
root = "~/.local/share/ciacola/repos"
repos = ["joshrotenberg/mdbook-lint"]

# [plugins.webhook]
# hooks = [{ path = "issue", agent = "tower-mcp-manager" }]

# Reusable agent definitions, exposed as MCP prompts and to spawn_role.
# Plugins ship their own; these win on a name collision.
#
# Provider-backed roles may use only `surface = "agent"` (the default; spawn,
# send, wait and friends). `surface = "operator"` is rejected at startup and
# by every role-spawn path because the root HTTP bearer is human-only.
# [[roles]]
# name = "summarizer"
# description = "Summarizes one PR in five bullets."
# provider = "codex"
# inherit_provider_tools = true
# sandbox = "read-only"
# model = "gpt-5.6-sol"
# arguments = ["repo", "pr"]
# system_prompt = "..."

# Persistent agents: upserted by name at every boot. The definition
# follows this file; the identity and conversation persist.
# [[agents]]
# name = "tower-mcp-manager"
# role = "repo-manager"
# arguments = { checkout = "/path/to/your/ciacola/checkout" }
#
# Config belonging to a plugin goes under its name. Core does not read
# these; the named plugin is handed its own section and parses it.
# [agents.plugins.schedule]
# every_secs = 1800
# text = "Wake up. Run your wake list."
