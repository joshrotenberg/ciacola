# ciacola, annotated. Every section is optional; a server with an empty
# config file starts, serves the six verbs, and does nothing until told.
# The ledger path is deliberately an environment setting, not TOML:
#
#   mkdir -p "$HOME/.local/share/ciacola"
#   CIACOLA_DB="$HOME/.local/share/ciacola/ciacola.db" cargo run -p ciacola
#
# Without CIACOLA_DB the server uses $XDG_DATA_HOME/ciacola/ciacola.db, or
# $HOME/.local/share/ciacola/ciacola.db when XDG_DATA_HOME is unset. A
# temporary fallback is used only when no user data directory can be found.
#
# Human HTTP access to /mcp-operator uses a root bearer supplied through an
# inherited descriptor, never TOML or argv:
#
#   cargo build --locked -p ciacola
#   operator_token="$(openssl rand -hex 32)"  # store it in a credential manager
#   CIACOLA_OPERATOR_TOKEN_FD=3 ./target/debug/ciacola \
#     3< <(printf '%s' "$operator_token")
#
# Omit it when using stdio only. Every provider-backed agent credential is
# refused on /mcp-operator; the root bearer is for a human client only.
# The ordinary /mcp mount is agent-only: Ciacola injects each active agent's
# scoped x-ciacola-agent credential on every request. Anonymous clients use
# stdio or the human-authenticated /mcp-operator mount instead.

[runtime]
# Backend used when a role or agent does not select one. Omit for Claude.
# default_provider = "codex"

# Seal the ambient provider config. "full" drops user, project, and
# local settings; "project" keeps the user's global ones. Worth having
# on for unattended work: an interactive session inherits a CLAUDE.md
# the person can see, a scheduled agent inherits it invisibly.
hermetic = "full"

# Provider-native containment. Codex write-capable workers usually want
# workspace-write-no-network, or workspace-write when their task needs the
# network. Claude refuses a sandbox request because permission prompts are not
# an OS boundary.
# sandbox = "workspace-write-no-network"

# Isolation removes the operator's standing rules along with everything
# else, so put them back deliberately. Inline, or a file, or both.
# house_rules_file = "~/.claude/CLAUDE.md"

# Provider config and session directory. Pointing this at the server's
# own directory keeps transcripts with the run that produced them,
# which is the precondition for mining them later.
#
# It also selects the login: a fresh directory authenticates as nobody.
# Authenticate that home separately, or on Unix pass a token through the
# inherited descriptor named by CIACOLA_CLAUDE_TOKEN_FD when launching the
# binary. Windows uses the separately authenticated home.
# claude_home = "~/.local/share/ciacola/claude"

# Codex keeps its own auth and sessions here. Authenticate it separately, or
# on Unix pass an API credential through CIACOLA_CODEX_TOKEN_FD at binary
# startup. Windows uses the separately authenticated home.
# codex_home = "~/.local/share/ciacola/codex"

# Provider children start from an empty environment. Ciacola restores only
# path/home/user/temp/locale basics plus exact names listed here. Git keeps its
# HOME-based config; SSH agents, proxies, Git overrides, GitHub credentials,
# Ciacola variables, and other workflow values require deliberate opt-in.
# provider_env_passthrough = ["SSH_AUTH_SOCK", "HTTPS_PROXY"]

[limits]
# Rolling admission circuit breakers, not per-turn budgets. Measured spend
# across real turns spans 54x, so no number is correct; a breaker only has to
# be wrong in the safe direction. These apply to new submissions, never to
# work already admitted. Leaving them commented is an explicit choice to run
# without a monetary admission breaker.
# daily_warn_usd = 25.0
# daily_stop_usd = 50.0

# Depth is the leading indicator: a conductor spawning conductors
# compounds faster than any spend check notices. 0 disables.
max_spawn_depth = 3

# Backends that do not report money need a provider token stop before
# schedules, webhooks, or agents may submit work to them. These are reported
# input + output over a rolling 24 hours; cached input is already included in
# input and is never counted twice. Warning-only configuration does not make
# unattended work admissible.
# [limits.providers.codex]
# daily_warn_tokens = 2_000_000
# daily_stop_tokens = 4_000_000
#
# A separate provider-native ceiling is reapplied to every opening or resumed
# Codex execution. This number is NOT portable total tokens and enforcement is
# NOT exact: the detected, wrapper-tested CLI version declares a versioned
# meter and checks it at provider-response boundaries. Work already in flight
# can overshoot; concurrent Codex root/subagent responses can multiply that
# soft-boundary overshoot, so it is not bounded to exactly one response. Codex
# 0.145-0.146 use weighted non-cached input + output; 0.147 prefers
# provider-supplied rollout units and uses that calculation only as a fallback.
# The board shows the exact meter, cache treatment, and granularity.
# per_turn_ceiling = 250_000

# Claude's provider-native ceiling is integer micro-USD: 2_000_000 means
# $2.00. Claude also checks at a provider-response boundary and can overshoot.
# Its rolling admission accounting remains the global daily USD policy above.
# [limits.providers.claude]
# per_turn_ceiling = 2_000_000

# Dollar and token stops are independent admission breakers: reaching either
# refuses new work, while admitted and running turns finish. They are not
# reservations, so one turn can cross the threshold and concurrent turns can
# multiply the overshoot. A per-turn ceiling narrows one execution; it does
# not reserve aggregate rolling capacity and concurrent turns each receive
# their own ceiling. Ciacola uses provider-declared meters and the measurements
# each backend reports and deliberately carries no provider price table.
#
# Omitting per_turn_ceiling is explicit UNBOUNDED behavior and does not by
# itself block otherwise-admissible automatic work. If it is configured but
# the installed adapter/CLI cannot honor it, automatic work fails closed
# before provider side effects. `send_supervised` may override unavailable
# protection only with a durable human reason; it never overrides a reached
# rolling stop. The effective ceiling and its semantics are persisted on the
# queued turn, so restart, recovery, and later config changes cannot widen it.
#
# Current Codex budget-failure JSONL omits terminal usage (upstream:
# https://github.com/openai/codex/issues/37676). Ciacola records usage as
# unreported, or retains an earlier partial snapshot, rather than presenting
# an invented exact usage or overshoot figure.

# Plugins read their own sections; the server never sees these fields.
[plugins.repo-worker]
root = "~/.local/share/ciacola/repos"
repos = ["joshrotenberg/mdbook-lint"]

# [plugins.webhook]
# hooks = [{ path = "issue", agent = "tower-mcp-manager" }]

# Reusable agent definitions, exposed as MCP prompts and to spawn_role.
# Plugins ship their own; these win on a name collision.
#
# Provider-backed roles may use only `surface = "agent"` (the default; spawn,
# send, wait and friends). `surface = "operator"` is rejected at startup and
# by every role-spawn path because the root HTTP bearer is human-only.
# [[roles]]
# name = "summarizer"
# description = "Summarizes one PR in five bullets."
# provider = "codex"
# inherit_provider_tools = true
# sandbox = "read-only"
# model = "gpt-5.6-sol"
# arguments = ["repo", "pr"]
# system_prompt = "..."

# Persistent agents: upserted by name at every boot. The definition
# follows this file; the identity and conversation persist.
# [[agents]]
# name = "tower-mcp-manager"
# role = "repo-manager"
# arguments = { checkout = "/path/to/your/ciacola/checkout" }
#
# Config belonging to a plugin goes under its name. Core does not read
# these; the named plugin is handed its own section and parses it.
# [agents.plugins.schedule]
# every_secs = 1800
# text = "Wake up. Run your wake list."
