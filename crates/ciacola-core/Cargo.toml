[package]
name = "ciacola-core"
description = "An agent is a durable conversation: ledger, executor, plugin trait, and MCP surface."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
axum = { workspace = true }
# The provider contract, not any adapter. Core resolves a backend by the
# key an agent's definition carries; the binary decides what that key
# resolves to. Adding an adapter dependency here would put core back
# where issue 53 found it.
ciacola-agent = { workspace = true }
schemars = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sqlx = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
toml = { workspace = true }
tower-mcp = { workspace = true }
tracing = { workspace = true }
ulid = { workspace = true }
