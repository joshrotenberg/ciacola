[package]
name = "ciacola"
description = "A laptop-local agent server: durable conversations, fronted entirely by MCP."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[[bin]]
name = "ciacola"
path = "src/main.rs"

[dependencies]
sqlx = { workspace = true }
tempfile = { workspace = true }
# Runtime assembly: the binary is the one place that knows which
# backends this build has, so it is the only crate that depends on an
# adapter. Core takes the registry it produces and never names a
# wrapper itself.
ciacola-agent = { workspace = true }
ciacola-agent-claude = { workspace = true }
ciacola-agent-codex = { workspace = true }
ciacola-core = { workspace = true }
ciacola-board = { path = "../ciacola-board" }
ciacola-findings = { path = "../ciacola-findings" }
ciacola-git = { path = "../ciacola-git" }
ciacola-kanban = { path = "../ciacola-kanban" }
ciacola-memory = { path = "../ciacola-memory" }
ciacola-refs = { path = "../ciacola-refs" }
ciacola-repo-worker = { path = "../ciacola-repo-worker" }
ciacola-schedule = { path = "../ciacola-schedule" }
ciacola-tuning = { path = "../ciacola-tuning" }
ciacola-webhook = { path = "../ciacola-webhook" }
axum = { workspace = true }
serde = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
toml = { workspace = true }
tower-mcp = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
serde_json = { workspace = true }
tower = { version = "0.5", features = ["util"] }
